version: "2"

# Единая точка приёма OTLP/gRPC для всех сигналов OpenTelemetry.
otel-telemetry-pipeline:
  source:
    otlp:
      port: 21893
      ssl: false
      # trace-analytics-raw uses the classic Trace Analytics schema. Keep
      # metrics in the native OTel format, but decode traces for that sink.
      traces_output_format: opensearch
      authentication:
        unauthenticated:
  route:
    - traces: 'getEventType() == "TRACE"'
    - metrics: 'getEventType() == "METRIC"'
  sink:
    - pipeline:
        name: "otel-traces-pipeline"
        routes:
          - traces
    - pipeline:
        name: "otel-metrics-pipeline"
        routes:
          - metrics

otel-traces-pipeline:
  source:
    pipeline:
      name: "otel-telemetry-pipeline"
  sink:
    - pipeline:
        name: "raw-traces-pipeline"
    - pipeline:
        name: "service-map-pipeline"

raw-traces-pipeline:
  source:
    pipeline:
      name: "otel-traces-pipeline"
  buffer:
    bounded_blocking:
      buffer_size: 1024
      batch_size: 128
  processor:
    - otel_traces:
  sink:
    - opensearch:
        hosts: [ "https://opensearch:9200" ]
        username: "admin"
        password: "YourSecurePassword123!"
        insecure: true
        index_type: trace-analytics-raw

service-map-pipeline:
  source:
    pipeline:
      name: "otel-traces-pipeline"
  buffer:
    bounded_blocking:
      buffer_size: 1024
      batch_size: 128
  processor:
    - service_map:
        window_duration: 60
  sink:
    - opensearch:
        hosts: [ "https://opensearch:9200" ]
        username: "admin"
        password: "YourSecurePassword123!"
        insecure: true
        index_type: "trace-analytics-service-map"

otel-metrics-pipeline:
  source:
    pipeline:
      name: "otel-telemetry-pipeline"
  buffer:
    bounded_blocking:
      buffer_size: 1024
      batch_size: 128
  processor:
    - otel_metrics:
        calculate_histogram_buckets: true
        calculate_exponential_histogram_buckets: true
        exponential_histogram_max_allowed_scale: 10
        flatten_attributes: false
  sink:
    # Dashboards читает SS4O-метрики из OpenSearch; он не является Data Prepper sink.
    - opensearch:
        hosts: [ "https://opensearch:9200" ]
        username: "admin"
        password: "YourSecurePassword123!"
        insecure: true
        template_type: index-template
        index: ss4o_metrics-otel-%{yyyy.MM.dd}
        bulk_size: 4
