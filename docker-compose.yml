services:
  # OpenSearch Node
  opensearch:
    build:
      context: .
      dockerfile: opensearch.Dockerfile
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - DISABLE_SECURITY_PLUGIN=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=YourSecurePassword123!
      # Требуется только для локального bootstrap, который добавляет OIDC auth domain через Security REST API.
      - plugins.security.unsupported.restapi.allow_securityconfig_modification=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # В контейнерах OIDC hostname направляется на опубликованный порт Keycloak через host gateway.
    extra_hosts:
      - "keycloak.lvh.me:host-gateway"
    networks:
      - otel-network

  opensearch-bootstrap:
    image: alpine:3.18
    container_name: opensearch-bootstrap
    volumes:
      - ./bootstrap.sh:/bootstrap.sh
      - ./templates:/templates:ro
      - ./policies:/policies:ro
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - "apk add --no-cache curl jq && /bootstrap.sh"
    depends_on:
      - opensearch
      - opensearch-dashboards
      - prometheus
      - seaweedfs
      - keycloak
    extra_hosts:
      - "keycloak.lvh.me:host-gateway"
    networks:
      - otel-network
    restart: "no"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    volumes:
      - ./opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    environment:
      OPENID_CLIENT_SECRET: OpenSearchOidcClientSecret123!
    extra_hosts:
      - "keycloak.lvh.me:host-gateway"
    depends_on:
      - opensearch
      - keycloak
    # Dashboards читает OIDC discovery на старте; Keycloak в dev mode может быть ещё не готов.
    restart: on-failure
    networks:
      - otel-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: KeycloakAdminPassword123!
      # lvh.me резолвится браузером в 127.0.0.1; в контейнерах адрес переопределён через host gateway.
      KC_HOSTNAME: http://keycloak.lvh.me:8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-opensearch.json:/opt/keycloak/data/import/realm-opensearch.json:ro
    networks:
      otel-network:
        aliases:
          - keycloak.lvh.me

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: seaweedfs
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-s3.port=8333"]
    ports:
      - "9000:8333" # S3 API
      - "23646:23646" # SeaweedFS Admin UI
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: MinioPassword123!
      S3_BUCKET: opensearch-snapshots,otel-archive
    volumes:
      - seaweedfs-data:/data
    networks:
      - otel-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - otel-network

########################################################################################################
############# PROD
########################################################################################################
  prod-server:
    build:
      context: ./dotnet-otel-demo/server
      dockerfile: Dockerfile
    container_name: prod-demo-server
    environment:
      OTEL_SERVICE_NAME: prod-demo-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://prod-otel-collector:4317
    # ports:
    #   - "5000:5000"
    depends_on:
      - prod-otel-collector
    networks:
      - otel-network
    restart: unless-stopped

  prod-client:
    build:
      context: ./dotnet-otel-demo/client
      dockerfile: Dockerfile
    container_name: prod-demo-client
    environment:
      SERVER_URL: http://prod-demo-server:5000/api/test
      INTERVAL_SECONDS: "30"
      OTEL_SERVICE_NAME: prod-demo-client
      OTEL_EXPORTER_OTLP_ENDPOINT: http://prod-otel-collector:4317
    depends_on:
      - prod-server
      - prod-otel-collector
    networks:
      - otel-network
    restart: unless-stopped

  prod-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: prod-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./tenants/prod/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      # AWS SDK внутри коллектора автоматически прочитает эти переменные
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=MinioPassword123!
    # ports:
    #   - "4317:4317"   # OTLP gRPC receiver
    #   - "4318:4318"   # OTLP HTTP receiver
    #   - "8889:8889"   # Prometheus exporter metrics
    # healthcheck:
    #   # Проверяем официальный эндпоинт здоровья коллектора
    #   #test: ["CMD", "curl", "-f", "http://localhost:13133/"]
    #   # test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:13133/ || exit 1"]
    #   test: ["CMD", "/otelcol-contrib", "healthcheck"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    depends_on:
      - prod-data-prepper
      - seaweedfs
    networks:
      - otel-network

  prod-vector:
    image: timberio/vector:0.57.0-alpine
    container_name: prod-vector
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: YourSecurePassword123!
    volumes:
      - ./tenants/prod/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Vector uses Docker API to collect stdout/stderr from containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - vector-data:/var/lib/vector
    depends_on:
      - opensearch
    networks:
      - otel-network
    restart: unless-stopped

  prod-data-prepper:
    image: opensearchproject/data-prepper:latest
    container_name: prod-data-prepper
    volumes:
      - ./tenants/prod/data-prepper/pipelines:/usr/share/data-prepper/pipelines:ro
      - ./tenants/prod/data-prepper/config/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml
    # ports:
    #   - "21893:21893" # Унифицированный OTLP/gRPC endpoint Data Prepper
    depends_on:
      - opensearch
    networks:
      - otel-network

